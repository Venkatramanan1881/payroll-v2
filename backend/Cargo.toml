# One Rust workspace (TSD §5.1). Package 1 uses shared, core, db and api.
# gateway (device push) and jobs (heavy background work) are added with Package 2.
[workspace]
resolver = "2"
members = ["crates/shared", "crates/core", "crates/db", "crates/api"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
jsonwebtoken = "9"
sha2 = "0.10"
serde_urlencoded = "0.7"
tower = { version = "0.5", features = ["util"] }
argon2 = { version = "0.5", features = ["std"] }
totp-rs = { version = "5", features = ["otpauth", "gen_secret"] }
aes-gcm = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
calamine = { version = "0.38", features = ["chrono"] }
rust_xlsxwriter = "0.104"
csv = "1.4"
